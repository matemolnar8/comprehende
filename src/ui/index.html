<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comprehende</title>
    <base href="./" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Mirrors THEME_STORAGE_KEY in src/ui/lib/theme.ts. Runs before the bundle loads, so it cannot import it.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("comprehende.theme");
        } catch {
          // Storage is blocked: follow the system.
        }
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = stored === "dark" || (stored !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
