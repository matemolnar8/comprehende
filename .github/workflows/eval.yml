# Full graded eval after skill, schema, review, or harness land on main.
# Needs repo secret MUSE_CODE_API_KEY. Skips (does not fail) when that secret is unset.
# Event-driven: path filter on main, plus workflow_dispatch. Not a cron.

name: Eval suite

on:
  push:
    branches: [main]
    paths:
      - "skills-next/comprehende/**"
      - "src/schema/**"
      - "src/review/**"
      - "scripts/eval/**"
      - "eval/cases/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

concurrency:
  group: eval-suite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Install Muse Code
        env:
          MUSE_CODE_API_KEY: ${{ secrets.MUSE_CODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL https://api.meta.ai/muse-launcher.sh -o ~/.local/bin/muse
          chmod +x ~/.local/bin/muse
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          MUSE_LAUNCHER_INSTALL=1 ~/.local/bin/muse
          ~/.local/bin/muse --version
      # Agent search tools use rg when it is on PATH. ubuntu-latest has none.
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Full graded eval
        env:
          MUSE_CODE_API_KEY: ${{ secrets.MUSE_CODE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MUSE_CODE_API_KEY}" ]; then
            echo "Repo secret MUSE_CODE_API_KEY is not set. Skipping the full graded suite."
            echo "Add it under Settings → Secrets and variables → Actions."
            echo "::warning::MUSE_CODE_API_KEY secret missing; full eval skipped"
            exit 0
          fi
          unset GITHUB_TOKEN GH_TOKEN
          pnpm eval -- --json
      - name: Upload eval run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: eval/runs
          if-no-files-found: ignore
