# Full graded eval after skill, schema, review, or harness land on main.
# Uses the Muse Code subscription login (repo secret MUSE_AUTH_JSON, a CI-only
# device login). Falls back to MUSE_CODE_API_KEY with a warning when the login
# is missing or expired. Skips (does not fail) when neither secret is set.
# Event-driven: path filter on main, plus workflow_dispatch. Not a cron.

name: Eval suite

on:
  push:
    branches: [main]
    paths:
      - "skills-next/comprehende/**"
      - "src/schema/**"
      - "src/review/**"
      - "scripts/eval/**"
      - "eval/cases/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

concurrency:
  group: eval-suite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Install Muse Code
        run: |
          set -euo pipefail
          mkdir -p ~/.local/bin
          curl -fsSL https://api.meta.ai/muse-launcher.sh -o ~/.local/bin/muse
          chmod +x ~/.local/bin/muse
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          MUSE_LAUNCHER_INSTALL=1 ~/.local/bin/muse
          ~/.local/bin/muse --version
      # Agent search tools use rg when it is on PATH. ubuntu-latest has none.
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Full graded eval
        env:
          MUSE_AUTH_JSON: ${{ secrets.MUSE_AUTH_JSON }}
          MUSE_CODE_API_KEY: ${{ secrets.MUSE_CODE_API_KEY }}
        run: |
          set -euo pipefail
          auth_args=""
          if [ -n "${MUSE_AUTH_JSON}" ]; then
            mkdir -p ~/.config/muse
            printf '%s' "${MUSE_AUTH_JSON}" > ~/.config/muse/auth.json
            chmod 600 ~/.config/muse/auth.json
            unset MUSE_AUTH_JSON
            if ~/.local/bin/muse usage >/dev/null 2>&1; then
              echo "Using the Muse Code subscription login."
            else
              echo "::warning::muse usage check failed; keeping the subscription login (a dead login fails the run visibly instead of silently spending API credit). Refresh it per docs/eval.md."
            fi
          else
            echo "::warning::MUSE_AUTH_JSON secret missing; falling back to MUSE_CODE_API_KEY."
            auth_args="--use-api-key"
          fi
          if [ -n "${auth_args}" ] && [ -z "${MUSE_CODE_API_KEY}" ]; then
            echo "No working login and no MUSE_CODE_API_KEY. Skipping the full graded suite."
            echo "Add the secrets under Settings → Secrets and variables → Actions."
            echo "::warning::no Muse credential available; full eval skipped"
            exit 0
          fi
          unset GITHUB_TOKEN GH_TOKEN
          pnpm eval -- --json --jobs 2 ${auth_args}
      - name: Upload eval run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: eval/runs
          if-no-files-found: ignore
          retention-days: 7
