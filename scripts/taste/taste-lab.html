<title>Taste Lab</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap"
/>
<style>
  /* Layout: one thumb-reach column. Two tabs on top, one card in the middle, big answer buttons under it. Highlighter yellow marks the thing you judge. */
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --ink: #17202c;
    --muted: #5d6979;
    --line: #d5dbe4;
    --mark: #ffe45c;
    --mark-ink: #3a3200;
    --good: #1f8f5f;
    --good-bg: #dff5ea;
    --bad: #c43d3d;
    --bad-bg: #fbe3e3;
    --code-bg: #f3f5f9;
    --hl: #fff6bf;
    --display: "Space Grotesk", system-ui, sans-serif;
    --body: "Inter", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151c;
      --card: #1a222d;
      --ink: #e8edf3;
      --muted: #97a3b3;
      --line: #2e3947;
      --mark: #f2d23c;
      --mark-ink: #2a2400;
      --good: #4cc98f;
      --good-bg: #16382a;
      --bad: #f07a7a;
      --bad-bg: #432020;
      --code-bg: #131a23;
      --hl: #4a4212;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151c;
    --card: #1a222d;
    --ink: #e8edf3;
    --muted: #97a3b3;
    --line: #2e3947;
    --mark: #f2d23c;
    --mark-ink: #2a2400;
    --good: #4cc98f;
    --good-bg: #16382a;
    --bad: #f07a7a;
    --bad-bg: #432020;
    --code-bg: #131a23;
    --hl: #4a4212;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 40px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    font-family: var(--display);
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h1 span {
    background: var(--mark);
    color: var(--mark-ink);
    padding: 0 6px;
    border-radius: 3px;
  }
  #saved {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  nav a {
    text-align: center;
    padding: 10px 4px;
    border-radius: 10px;
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    background: var(--card);
  }
  nav a[aria-current="true"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .card h2 {
    font-family: var(--display);
    font-size: 18px;
    margin: 0;
    text-wrap: balance;
  }
  .card p {
    margin: 0;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .ctx {
    font-size: 13px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  code {
    font-family: var(--mono);
    font-size: 0.86em;
    background: var(--code-bg);
    padding: 1px 4px;
    border-radius: 4px;
    overflow-wrap: anywhere;
  }
  .src {
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 3px;
  }
  pre {
    margin: 0;
    background: var(--code-bg);
    border-radius: 8px;
    padding: 8px 0;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.55;
  }
  pre div {
    padding: 0 10px;
    white-space: pre;
  }
  pre div.on {
    background: var(--hl);
  }
  pre i {
    font-style: normal;
    color: var(--muted);
    display: inline-block;
    width: 3.2em;
  }
  .acts {
    display: grid;
    gap: 8px;
  }
  .acts.two {
    grid-template-columns: 1fr 1fr;
  }
  button {
    font: inherit;
    font-weight: 600;
    min-height: 52px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    padding: 8px 12px;
  }
  button:focus-visible,
  a:focus-visible,
  textarea:focus-visible {
    outline: 3px solid var(--mark);
    outline-offset: 2px;
  }
  button.good {
    background: var(--good-bg);
    border-color: var(--good);
    color: var(--good);
  }
  button.bad {
    background: var(--bad-bg);
    border-color: var(--bad);
    color: var(--bad);
  }
  button.quiet {
    min-height: 40px;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
  }
  textarea {
    font: inherit;
    width: 100%;
    box-sizing: border-box;
    min-height: 64px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    padding: 10px;
    resize: vertical;
  }
  .duo {
    display: grid;
    gap: 10px;
  }
  .duo .card {
    cursor: pointer;
    text-align: left;
    font-weight: 400;
  }
  .tag {
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    background: var(--mark);
    color: var(--mark-ink);
    border-radius: 4px;
    padding: 0 7px;
    align-self: flex-start;
  }
  .ba {
    display: grid;
    gap: 8px;
  }
  .ba div {
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 15px;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .ba .b {
    background: var(--bad-bg);
  }
  .ba .a {
    background: var(--good-bg);
  }
  .ba small {
    display: block;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-variant-numeric: tabular-nums;
  }
  td,
  th {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    overflow-wrap: anywhere;
  }
</style>

<div class="wrap">
  <header>
    <h1><span>Taste</span> Lab</h1>
    <div id="saved"></div>
  </header>
  <nav id="nav"><a href="#duel">Duel</a><a href="#rules">Rules</a></nav>
  <div id="stage"></div>
</div>

<script>
  // Cards come from the store: `duels` (written by `pnpm taste:cards`) and `rules` (written by the agent). Answers go to `answers`.
  const $ = (t, c, h) => {
    const e = document.createElement(t);
    if (c) e.className = c;
    if (h != null) e.innerHTML = h;
    return e;
  };
  const esc = (s) =>
    String(s).replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
    );
  const md = (s) =>
    esc(s)
      .replace(/\[([^\]]+)\]\(source:[^)]+\)/g, '<span class="src">$1</span>')
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  const btn = (label, cls, fn) => {
    const b = $("button", cls);
    b.type = "button";
    b.textContent = label;
    b.onclick = fn;
    return b;
  };
  const codeBlock = (code) => {
    const p = $("pre");
    for (const [n, l] of code.lines) {
      const d = $("div", n === code.on ? "on" : "");
      d.innerHTML = "<i>" + n + "</i>" + esc(l);
      p.append(d);
    }
    return p;
  };

  const data = { duel: [], rules: [] };
  const answers = {};
  const idx = { duel: 0, rules: 0 };
  let db = null,
    state = "loading";
  const stage = document.getElementById("stage"),
    savedEl = document.getElementById("saved");
  const open = (m) => data[m].filter((c) => !answers[m + "__" + c.id]).length;
  function count() {
    document.querySelectorAll("#nav a").forEach((a) => {
      const m = a.getAttribute("href").slice(1);
      const n = open(m);
      a.textContent = (m === "duel" ? "Duel" : "Rules") + (n ? " · " + n : "");
    });
  }
  function save(mode, id, row) {
    const key = mode + "__" + id;
    answers[key] = { mode, item: id, at: new Date().toISOString(), ...row };
    count();
    db.doc("answers/" + key)
      .set(answers[key])
      .then(
        () => {
          savedEl.textContent = "Saved";
        },
        () => {
          delete answers[key];
          count();
          savedEl.textContent = "Not saved. Check your connection.";
        },
      );
  }
  const firstOpen = (m) => {
    const i = data[m].findIndex((c) => !answers[m + "__" + c.id]);
    return i < 0 ? data[m].length : i;
  };
  const meta = (kind, i, n) => {
    const m = $("div", "meta");
    m.append($("span", "", esc(kind)), $("span", "", i + 1 + " / " + n));
    return m;
  };
  const back = (m) =>
    btn("Back", "quiet", () => {
      idx[m] = Math.max(0, idx[m] - 1);
      render();
    });
  const again = (m) =>
    btn("Look again", "quiet", () => {
      idx[m] = 0;
      render();
    });
  // The side a model shows on is fixed per card, and half the cards flip.
  const flipped = (id) => parseInt(id.slice(-1), 16) % 2 === 1;

  function renderDuel() {
    const list = data.duel,
      i = idx.duel;
    if (!list.length)
      return empty("No duels to judge.", "Your agent loads them from two eval runs.");
    if (i >= list.length) return doneDuel();
    const it = list[i];
    const [A, B] = flipped(it.id) ? [it.y, it.x] : [it.x, it.y];
    stage.append(meta(it.kind, i, list.length));
    const head = $("div", "card");
    head.append($("h2", "", esc(it.question)), $("div", "ctx", esc(it.context)));
    if (it.code) head.append(codeBlock(it.code));
    stage.append(head);
    const vote = (answer, win, lose) => {
      if (tooSoon()) return;
      save("duel", it.id, {
        texts: { x: it.x, y: it.y },
        answer,
        winner: win ? win.label : null,
        loser: lose ? lose.label : null,
        labels: [it.x.label, it.y.label],
        shownFirst: A.label,
        kind: it.kind,
        case: it.case,
      });
      idx.duel++;
      render();
    };
    const duo = $("div", "duo");
    [
      ["A", A, B],
      ["B", B, A],
    ].forEach(([l, me, other]) => {
      const c = $("button", "card");
      c.type = "button";
      c.append($("span", "tag", l));
      if (me.title) c.append($("h2", "", md(me.title)));
      c.append($("p", "", md(me.text)));
      c.onclick = () => vote("pick", me, other);
      duo.append(c);
    });
    stage.append(duo);
    const acts = $("div", "acts two");
    acts.append(
      btn("About the same", "", () => vote("same")),
      btn("Both bad", "bad", () => vote("both-bad")),
    );
    stage.append(acts);
    if (i > 0) stage.append(back("duel"));
  }
  function doneDuel() {
    const rows = data.duel.map((d) => answers["duel__" + d.id]).filter(Boolean);
    const labels = [...new Set(rows.flatMap((r) => r.labels || []))];
    const c = $("div", "card");
    c.append($("h2", "", "All duels judged."));
    const t = $("table");
    t.innerHTML =
      "<tr><th>Side</th><th>Wins</th><th>Losses</th></tr>" +
      labels
        .map(
          (l) =>
            "<tr><td>" +
            esc(l) +
            "</td><td>" +
            rows.filter((r) => r.winner === l).length +
            "</td><td>" +
            rows.filter((r) => r.loser === l).length +
            "</td></tr>",
        )
        .join("");
    c.append(t);
    stage.append(c, again("duel"));
  }

  function renderRules() {
    const list = data.rules,
      i = idx.rules;
    if (!list.length)
      return empty("No rules to judge.", "Your agent proposes them from your duel picks.");
    if (i >= list.length) {
      const c = $("div", "card");
      c.append($("h2", "", "All rules judged."));
      const ok = list.filter((r) => (answers["rules__" + r.id] || {}).answer === "yes");
      c.append(
        $("p", "", ok.length ? ok.map((r) => "• " + esc(r.rule)).join("\n") : "You approved none."),
      );
      stage.append(c, again("rules"));
      return;
    }
    const it = list[i];
    stage.append(meta("Proposed rule", i, list.length));
    const c = $("div", "card");
    c.append($("h2", "", esc(it.rule)));
    if (it.evidence) c.append($("div", "ctx", esc(it.evidence)));
    const ba = $("div", "ba");
    ba.append(
      $("div", "b", "<small>Now</small>" + md(it.before)),
      $("div", "a", "<small>With the rule</small>" + md(it.after)),
    );
    c.append(ba);
    stage.append(c);
    const ta = $("textarea");
    ta.id = "rule-note";
    ta.placeholder = "Optional: when does this not hold?";
    const go = (a) => () => {
      if (tooSoon()) return;
      save("rules", it.id, { answer: a, rule: it.rule, note: ta.value.trim() });
      idx.rules++;
      render();
    };
    const acts = $("div", "acts two");
    acts.append(btn("No", "bad", go("no")), btn("Yes, add it", "good", go("yes")));
    const more = $("div", "acts two");
    more.append(
      btn("The other way round", "", go("reverse")),
      btn("It depends", "", go("depends")),
    );
    stage.append(acts, more, ta);
    if (i > 0) stage.append(back("rules"));
  }

  function empty(title, body) {
    const c = $("div", "card");
    c.append($("h2", "", esc(title)), $("p", "ctx", esc(body)));
    stage.append(c);
  }
  const MODES = { duel: renderDuel, rules: renderRules };
  const mode = () => (MODES[location.hash.slice(1)] ? location.hash.slice(1) : "duel");
  // A second tap of a double-tap lands on the next card's button, so a fresh card ignores taps for a moment.
  let shownAt = 0;
  const tooSoon = () => Date.now() - shownAt < 350;
  function render() {
    shownAt = Date.now();
    const m = mode();
    stage.innerHTML = "";
    document
      .querySelectorAll("#nav a")
      .forEach((a) => a.setAttribute("aria-current", a.getAttribute("href") === "#" + m));
    if (state === "loading") empty("Loading cards…", "");
    else if (state === "off")
      empty("The card store is not available here.", "Open this page signed in to claude.ai.");
    else MODES[m]();
    count();
  }
  window.addEventListener("hashchange", render);
  render();
  (async () => {
    const timer = setTimeout(() => {
      if (state === "loading") {
        state = "off";
        render();
      }
    }, 10000);
    try {
      const d = window.claude && window.claude.use ? await window.claude.use("db") : null;
      if (!d) throw new Error("no db");
      const [duels, rules, ans] = await Promise.all(
        ["duels", "rules", "answers"].map((c) => d.collection(c).get()),
      );
      const rows = (s) =>
        s.docs
          .map((x) => ({ id: x.id, ...x.data() }))
          .sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || a.id.localeCompare(b.id));
      data.duel = rows(duels);
      data.rules = rows(rules);
      ans.docs.forEach((x) => {
        answers[x.id] = x.data();
      });
      db = d;
      state = "ready";
      idx.duel = firstOpen("duel");
      idx.rules = firstOpen("rules");
    } catch (e) {
      state = "off";
    }
    clearTimeout(timer);
    render();
  })();
</script>
