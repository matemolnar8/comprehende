<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comprehende</title>
    <base href="./" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Mirrors THEME_STORAGE_KEY in src/ui/lib/theme.ts. Runs before the bundle loads, so it cannot import it.
      (() => {
        try {
          const stored = localStorage.getItem("comprehende.theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const dark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          // private mode
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-DYQfxB61.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Dr6xT1bE.css">
  </head>

    <div id="root"></div>
  </body>
</html>
